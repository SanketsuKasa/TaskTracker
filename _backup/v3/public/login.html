<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Task Tracker — Вход</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="auth-page">

    <div class="auth-card">

        <div class="logo auth-logo">
            <div class="logo-icon">✓</div>
            <span>Task Tracker</span>
        </div>

        <!-- Вкладки -->
        <div class="auth-tabs">
            <button type="button" class="auth-tab active" data-mode="login">Sign in</button>
            <button type="button" class="auth-tab" data-mode="register">Create account</button>
        </div>

        <h1 id="authTitle">Welcome back</h1>
        <p class="auth-subtitle" id="authSubtitle">Sign in with your email to see your tasks.</p>

        <form id="authForm" novalidate>

            <!-- Имя (только при регистрации) -->
            <div class="form-group register-only">
                <label for="authName">Name</label>
                <input type="text" id="authName" placeholder="Your name" autocomplete="name">
            </div>

            <div class="form-group">
                <label for="authEmail">Email</label>
                <input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email" required>
            </div>

            <div class="form-group">
                <label for="authPassword">Password</label>
                <div class="password-field">
                    <input type="password" id="authPassword" placeholder="At least 6 characters" autocomplete="current-password" required>
                    <button type="button" id="togglePassword">Show</button>
                </div>
            </div>

            <!-- Повтор пароля (только при регистрации) -->
            <div class="form-group register-only">
                <label for="authPassword2">Repeat password</label>
                <input type="password" id="authPassword2" placeholder="Repeat password" autocomplete="new-password">
            </div>

            <div class="auth-error" id="authError"></div>

            <button type="submit" class="create-button auth-submit" id="authSubmit">
                Sign in
            </button>

        </form>

    </div>


    <script>

        // Если уже вошли — сразу в приложение
        if (localStorage.getItem("token")) {
            location.href = "/";
        }

        const tabs = document.querySelectorAll(".auth-tab");
        const form = document.querySelector("#authForm");
        const card = document.querySelector(".auth-card");

        const nameInput = document.querySelector("#authName");
        const emailInput = document.querySelector("#authEmail");
        const passwordInput = document.querySelector("#authPassword");
        const password2Input = document.querySelector("#authPassword2");

        const errorBox = document.querySelector("#authError");
        const submitButton = document.querySelector("#authSubmit");
        const title = document.querySelector("#authTitle");
        const subtitle = document.querySelector("#authSubtitle");

        let mode = "login";


        // Переключение Вход / Регистрация
        function setMode(newMode) {

            mode = newMode;

            tabs.forEach(tab => {
                tab.classList.toggle("active", tab.dataset.mode === mode);
            });

            card.classList.toggle("register-mode", mode === "register");

            if (mode === "login") {
                title.textContent = "Welcome back";
                subtitle.textContent = "Sign in with your email to see your tasks.";
                submitButton.textContent = "Sign in";
                passwordInput.autocomplete = "current-password";
            } else {
                title.textContent = "Create your account";
                subtitle.textContent = "Your tasks and calendar will be saved to your email.";
                submitButton.textContent = "Create account";
                passwordInput.autocomplete = "new-password";
            }

            errorBox.textContent = "";
        }

        tabs.forEach(tab => {
            tab.addEventListener("click", () => setMode(tab.dataset.mode));
        });


        // Показать / скрыть пароль
        const togglePassword = document.querySelector("#togglePassword");

        togglePassword.addEventListener("click", () => {
            const hidden = passwordInput.type === "password";
            passwordInput.type = hidden ? "text" : "password";
            togglePassword.textContent = hidden ? "Hide" : "Show";
        });


        // Отправка формы
        form.addEventListener("submit", async (event) => {

            event.preventDefault();

            errorBox.textContent = "";

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            // Проверки на клиенте
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errorBox.textContent = "Enter a valid email";
                return;
            }

            if (password.length < 6) {
                errorBox.textContent = "Password must be at least 6 characters";
                return;
            }

            if (mode === "register") {

                if (!nameInput.value.trim()) {
                    errorBox.textContent = "Enter your name";
                    return;
                }

                if (password !== password2Input.value) {
                    errorBox.textContent = "Passwords do not match";
                    return;
                }
            }

            submitButton.disabled = true;

            try {

                const response = await fetch(`/api/${mode}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        name: nameInput.value.trim(),
                        email: email,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Error");
                }

                // Сохраняем токен и пользователя
                localStorage.setItem("token", data.token);
                localStorage.setItem("user", JSON.stringify(data.user));

                location.href = "/";

            } catch (error) {

                errorBox.textContent = error.message;

            } finally {

                submitButton.disabled = false;

            }

        });

    </script>

</body>

</html>
